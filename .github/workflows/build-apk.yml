name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unlock signing key
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -f mobile/signing/keystore.enc ] && [ -n "$KS_PASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in mobile/signing/keystore.enc -out "$RUNNER_TEMP/graphicwo.jks" -pass env:KS_PASS
            echo "KS_PATH=$RUNNER_TEMP/graphicwo.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key yet — building with a temporary key. Run 'Setup Android signing key' once."
          fi

      - name: Build APK (Trusted Web Activity)
        working-directory: mobile
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../GraphicWO_Studio.apk
          rm -f "$RUNNER_TEMP/graphicwo.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: GraphicWO_Studio_APK
          path: GraphicWO_Studio.apk

      - name: Replace old APK in release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset android-latest GraphicWO_Studio.apk -y || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "📱 GraphicWO Studio — Android"
          make_latest: false
          files: GraphicWO_Studio.apk
          body: |
            ## 📱 GraphicWO Studio — Android
            نزّل **GraphicWO_Studio.apk** وثبّته. التطبيق بيشتغل جوّا Chrome، فتسجيل الدخول بغوغل والتنزيل بيشتغلوا متل الموقع.
            إذا كان عندك النسخة القديمة، احذفها أولاً.

            Download **GraphicWO_Studio.apk** and install it. The app runs inside Chrome, so Google sign-in and downloads work just like on the website. If you have the old version, uninstall it first.

            Téléchargez **GraphicWO_Studio.apk** et installez-le. L'app fonctionne dans Chrome : la connexion Google et les téléchargements marchent comme sur le site. Désinstallez d'abord l'ancienne version.
