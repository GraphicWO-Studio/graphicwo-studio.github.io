name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon & splash
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#0b0f1a" --iconBackgroundColorDark "#0b0f1a" --splashBackgroundColor "#0b0f1a" --splashBackgroundColorDark "#0b0f1a"

      - name: Set version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../GraphicWO_Studio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GraphicWO_Studio_APK
          path: GraphicWO_Studio.apk

      - name: Replace old APK in release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset android-latest GraphicWO_Studio.apk -y || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "📱 GraphicWO Studio — Android"
          make_latest: false
          files: GraphicWO_Studio.apk
          body: |
            ## 📱 GraphicWO Studio — تطبيق أندرويد / Android app / Application Android
            نزّل **GraphicWO_Studio.apk** وافتحه على موبايلك. إذا طلب إذن «تثبيت تطبيقات غير معروفة» اسمح للمتصفح.

            Download **GraphicWO_Studio.apk** and open it on your phone (allow “install unknown apps” for your browser if asked).

            Téléchargez **GraphicWO_Studio.apk** et ouvrez-le sur votre téléphone (autorisez « applications inconnues » si demandé).
