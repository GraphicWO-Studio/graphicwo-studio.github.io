name: Auto-moderate training images

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dataset
  cancel-in-progress: false

jobs:
  moderate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secret
        id: check
        env:
          DS: ${{ secrets.DATASET_TOKEN }}
        run: if [ -z "$DS" ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi

      - name: Get dataset
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: GraphicWO-Studio/graphicwo-dataset
          token: ${{ secrets.DATASET_TOKEN }}
          path: ds

      - name: Anything new?
        if: steps.check.outputs.ready == 'true'
        id: new
        run: if [ -d ds/pending ] && [ -n "$(ls -A ds/pending 2>/dev/null)" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "Nothing new."; echo "yes=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.new.outputs.yes == 'true'
        with:
          python-version: "3.12"

      - name: Check images
        if: steps.new.outputs.yes == 'true'
        run: |
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch
          pip install -q transformers pillow imagehash
          python tools/moderate.py ds

      - name: Save
        if: steps.new.outputs.yes == 'true'
        working-directory: ds
        run: |
          git config user.name "GraphicWO Bot"
          git config user.email "graphicwo@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Auto-moderation"
          git push -q
