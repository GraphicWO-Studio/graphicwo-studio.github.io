plugins { id "com.android.application" }

def ksPath = System.getenv("KS_PATH")

android {
    namespace "io.github.graphicwostudio.app"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.graphicwostudio.app"
        minSdk 21
        targetSdk 35
        versionCode((System.getenv("VERSION_CODE") ?: "1") as int)
        versionName "2." + (System.getenv("VERSION_CODE") ?: "0")
    }

    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("KS_PASS")
                keyAlias "graphicwo"
                keyPassword System.getenv("KS_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
